<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c1d95"/><stop offset="0.5" stop-color="#2e1065"/><stop offset="1" stop-color="#0a0014"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#db2777"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="lcd" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#2a0f3f"/><stop offset="1" stop-color="#0b0216"/>
    </radialGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0.55"/><stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screen"><rect x="100" y="90" width="400" height="230" rx="14"/></clipPath>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .mono{font-family:'Courier New',monospace;font-weight:bold}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    @keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.86)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
    @keyframes scan{0%{transform:translateY(-20px)}100%{transform:translateY(250px)}}
    @keyframes blink{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
    @keyframes eyes{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
    @keyframes bar{0%,100%{width:60px}50%{width:150px}}
    @keyframes led{0%,100%{fill:#4c1d95}50%{fill:#f0abfc}}
    .float{animation:float 3s ease-in-out infinite}
    .wingL{transform-origin:290px 190px;animation:flap 1.6s ease-in-out infinite}
    .wingR{transform-origin:310px 190px;animation:flap 1.6s ease-in-out infinite}
    .aura{animation:pulse 2.5s ease-in-out infinite}
    .scan{animation:scan 3s linear infinite}
    .blink{animation:blink 1.4s steps(1) infinite}
    .eye{transform-origin:300px 172px;animation:eyes 4s infinite}
    .bar{animation:bar 4s ease-in-out infinite}
    .led{animation:led 1.2s ease-in-out infinite}
  </style>

  <!-- corpo do digivice -->
  <rect x="40" y="30" width="520" height="380" rx="70" fill="url(#body)" stroke="url(#rim)" stroke-width="6"/>
  <rect x="55" y="45" width="490" height="350" rx="58" fill="none" stroke="#e879f9" stroke-opacity=".25" stroke-width="2"/>
  <circle cx="300" cy="62" r="14" fill="#0a0014" stroke="url(#rim)" stroke-width="3"/>
  <text x="300" y="75" font-size="0" class="mono"> </text>

  <!-- moldura da tela -->
  <rect x="88" y="78" width="424" height="254" rx="22" fill="#0a0014" stroke="#db2777" stroke-width="3"/>
  <rect x="100" y="90" width="400" height="230" rx="14" fill="url(#lcd)"/>

  <g clip-path="url(#screen)">
    <!-- grade -->
    <g stroke="#a855f7" stroke-opacity=".12">
      <path d="M100 130H500M100 170H500M100 210H500M100 250H500M100 290H500"/>
      <path d="M150 90V320M200 90V320M250 90V320M300 90V320M350 90V320M400 90V320M450 90V320"/>
    </g>
    <!-- aura -->
    <circle class="aura" cx="300" cy="205" r="115" fill="url(#aura)"/>
    <!-- digimon -->
    <g class="float">
      <g transform="translate(60,70) scale(.8)" filter="url(#glow)">
        <g class="wingL"><path d="M292,190 C250,115 170,105 115,140 C148,148 158,168 150,190 C175,184 186,200 180,222 C212,216 252,232 292,232 Z" fill="#3b0764" stroke="#e879f9" stroke-width="2"/></g>
        <g class="wingR"><path d="M308,190 C350,115 430,105 485,140 C452,148 442,168 450,190 C425,184 414,200 420,222 C388,216 348,232 308,232 Z" fill="#3b0764" stroke="#e879f9" stroke-width="2"/></g>
        <path d="M284,150 C284,134 316,134 316,150 L323,215 L348,292 L252,292 L277,215 Z" fill="#1e0536" stroke="#f0abfc" stroke-width="2"/>
        <path d="M286,126 C266,160 272,205 262,240 L284,212 Z M314,126 C334,160 328,205 338,240 L316,212 Z" fill="#581c87" stroke="#f0abfc" stroke-width="1.5"/>
        <circle cx="300" cy="128" r="15" fill="#2e1065" stroke="#f0abfc" stroke-width="2"/>
        <path d="M290,118 C280,95 262,92 256,78 C276,82 294,95 298,114 Z M310,118 C320,95 338,92 344,78 C324,82 306,95 302,114 Z" fill="#db2777" stroke="#fbcfe8" stroke-width="1.5"/>
        <g class="eye"><ellipse cx="294" cy="128" rx="3.5" ry="2" fill="#f0abfc"/><ellipse cx="306" cy="128" rx="3.5" ry="2" fill="#f0abfc"/></g>
        <path d="M296,160 L300,172 L304,160" fill="none" stroke="#db2777" stroke-width="2"/>
      </g>
    </g>
    <!-- linha de scan -->
    <rect class="scan" x="100" y="90" width="400" height="14" fill="#e879f9" opacity=".18"/>
    <!-- HUD -->
    <text x="116" y="116" font-size="15" fill="#f0abfc" class="mono">LILITHMON</text>
    <text x="484" y="116" font-size="12" fill="#db2777" text-anchor="end" class="mono">DEMON LORD</text>
    <text x="116" y="300" font-size="11" fill="#e879f9" class="mono">HP</text>
    <rect x="136" y="291" width="150" height="9" fill="none" stroke="#e879f9" stroke-opacity=".6"/>
    <rect class="bar" x="136" y="291" width="150" height="9" fill="#db2777"/>
    <text x="484" y="300" font-size="12" fill="#f0abfc" text-anchor="end" class="mono blink">SCANNING_</text>
  </g>

  <!-- botoes -->
  <g stroke="url(#rim)" stroke-width="3">
    <circle cx="190" cy="372" r="17" fill="#1e0536"/>
    <circle cx="300" cy="372" r="17" fill="#1e0536"/>
    <circle cx="410" cy="372" r="17" fill="#1e0536"/>
  </g>
  <circle class="led" cx="300" cy="372" r="6"/>
  <text x="190" y="377" font-size="12" fill="#e879f9" text-anchor="middle" class="mono">A</text>
  <text x="410" y="377" font-size="12" fill="#e879f9" text-anchor="middle" class="mono">B</text>
</svg>
